<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Road Animation</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

<div class="scene">

    <div class="sky">
        <div class="sun"></div>

        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
    </div>


    <div class="mountains">
        <div class="mountain mountain1"></div>
        <div class="mountain mountain2"></div>
        <div class="mountain mountain3"></div>
    </div>


    <div class="forest">

        <div class="tree tree1"></div>
        <div class="tree tree2"></div>
        <div class="tree tree3"></div>
        <div class="tree tree4"></div>
        <div class="tree tree5"></div>

    </div>


    <div class="road">

        <div class="road-line line1"></div>
        <div class="road-line line2"></div>
        <div class="road-line line3"></div>
        <div class="road-line line4"></div>

    </div>


    <div class="cars">

        <div class="car car1">

            <div class="body"></div>

            <div class="wheel wheel1"></div>
            <div class="wheel wheel2"></div>

        </div>


        <div class="car car2">

            <div class="body"></div>

            <div class="wheel wheel1"></div>
            <div class="wheel wheel2"></div>

        </div>


        <div class="car car3">

            <div class="body"></div>

            <div class="wheel wheel1"></div>
            <div class="wheel wheel2"></div>

        </div>


    </div>


</div>


</body>
</html>
