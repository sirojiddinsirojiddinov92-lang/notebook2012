<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- vazifa uchun berilgan yangi animatsiyalar urganish uchun -->
    <!-- 1.animation-timing-function: linear;-bu bir xil tezlikda davom etadi -->
    <!-- 2.animation-timing-function: ease;-bu esa boshida sekin boshlanadi va urtasida tezlashadi va ohirida yana sekinlashadi -->
    <!-- 3.animation-timing-function: ease-in;-bu esa boshoda sekin boshlanadi -->
    <!-- 4.animation-timing-function: ease-out;-bu esa ohirida sekinlashadi -->
    <!-- 5.animation-timing-function: ease-in-out;-bu esa boshida ham ohirida ham sekin lashadi -->
    <!-- 6.animation-timing-function: cubic-bezier(.42,0,.58,1);bu professional usul bunda uzingiz tezlik egri chizig'ini yasaysiz-->
    <!-- 7.animation-timing-function: steps(5);-bunday esa animatsiya sakrab ishlaydi ko'pincha sprite animatsiyalarida ishlatiladi -->
    <!-- 8.animation-iteration-count: 5;-bu esa animatsiya necha marotaba davom etishini belgilaydi bunda 5 marta ishlaydi-->
    <!-- 9.animation-iteration-count: infinite;- bu ham bor buni animatsiyani chaqirganda ishlatsa ham buladi bu esa tuliq holati animatsiyani cheksiz davom ettirgizib beradi-->
    <!-- 10.animation-direction: normal;-bunda esa animatsiyani yo'nalishini belgilaydi buni turlari bor "normal,reverse,alternate,alternate-reverse" shular ham bor bulardan normal- oldinga, reverse - teskariga, alternate - oldinga orqaga oldinga , alternate-reverse - bu esa orqaga oldinga orqaga qilib beradi -->
    <!-- 11.animation-fill-mode: none;-bu esa animatisya tugagandan keyin nima bulishini belgilaydi masalan "none,forwards,backwards,both" bular none-standart, forwards- oxirgi holatda qoladi, backwards- bu esa boshlanish holatini oldindan qo'llaydi both - bu esa forwards,backwards ham deganidir shular -->
    <!-- 12.::before - bu esa elementni oldiga yangi element yaratib qushib beradi ::after -esa bu esa before bilan bir xil faqat bu ohiriga qushib beradi -->
</body>
</html>
